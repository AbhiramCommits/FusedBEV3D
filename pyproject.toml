[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusedbev3d"
version = "0.1.0"
description = "Multi-modal (camera + lidar) bird's-eye-view perception: 3D detection, tracking and voxel occupancy."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FusedBEV3D Authors" }]
keywords = ["bev", "lidar", "camera", "3d-detection", "tracking", "occupancy", "pytorch"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "pytest>=7.0",
  "ruff>=0.4",
]

[project.optional-dependencies]
nuscenes = ["nuscenes-devkit>=1.1.10"]
viz = ["open3d>=0.17"]

[tool.setuptools]
packages = [
  "fusedbev3d",
  "fusedbev3d.data",
  "fusedbev3d.models",
  "fusedbev3d.eval",
  "fusedbev3d.tracking",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "data", "runs", "results", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",  # long lines are handled by the formatter's line-length budget
  "B008",  # function calls in argument defaults (torch/numpy idioms)
  "SIM108",  # ternary expressions are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
